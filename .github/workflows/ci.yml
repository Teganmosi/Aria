name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — compile + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q main.py auth.py config.py database.py ai_service.py models.py

      - name: Dependency vulnerability audit
        continue-on-error: true # surface findings without blocking while the backlog is cleared
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build-time dummies — the real values are set per-environment on Render.
          # The app refuses to boot in production without these (see api/axios.ts).
          VITE_API_URL: https://api.example.com/api/v1
          VITE_WS_URL: wss://api.example.com

  # NOTE: the pytest suite is not yet hermetic (it performs live Supabase auth and DB
  # calls). Once it runs against an isolated database, add a `backend-tests` job here.
